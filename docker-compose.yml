services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/app.db
    volumes:
      - ./gerador:/app/gerador
      - ./web:/app/web
      - ./data:/app/data
      - ./input:/app/input
      - ./output:/app/output
    working_dir: /app
    command: gunicorn -b 0.0.0.0:8000 -w 1 --timeout 120 "web:create_app()"
