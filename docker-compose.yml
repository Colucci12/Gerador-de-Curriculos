services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gerador-curriculo-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_PATH: /app/data/app.db
    volumes:
      - app_data:/app/data
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-traefik}
      - traefik.http.routers.gerador-curriculo.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.gerador-curriculo.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.gerador-curriculo.tls=true
      - traefik.http.routers.gerador-curriculo.tls.certresolver=leresolver
      - traefik.http.routers.gerador-curriculo.service=gerador-curriculo
      - traefik.http.services.gerador-curriculo.loadbalancer.server.port=8000

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik}

volumes:
  app_data:
