{% extends "base.html" %}
{% block title %}Login — Resume Tailor{% endblock %}
{% block content %}
<article>
  <h1>Resume Tailor</h1>
  <p>Entre para adaptar seu currículo com a IA.</p>
  <form method="post" action="{{ url_for('main.login') }}">
    <label>
      E-mail
      <input type="email" name="email" required autocomplete="username">
    </label>
    <label>
      Senha
      <input type="password" name="password" required autocomplete="current-password">
    </label>
    <button type="submit">Entrar</button>
  </form>
  <p><a href="{{ url_for('main.register') }}">Criar conta</a></p>
</article>
{% endblock %}
