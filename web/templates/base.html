<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Resume Tailor{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root { --pico-font-size: 16px; }
    main.container { max-width: 960px; padding-top: 1.5rem; padding-bottom: 2rem; }
    textarea { min-height: 14rem; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9rem; }
    .flash { margin-bottom: 1rem; }
    .flash.error { color: var(--pico-del-color); }
    .flash.success { color: var(--pico-ins-color); }
    .htmx-indicator { display: none; }
    .htmx-indicator.htmx-request { display: inline; }
    .htmx-request .btn-label { display: none; }
    nav { margin-bottom: 1rem; }
  </style>
</head>
<body>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <p class="flash {{ category }}" role="status">{{ message }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
