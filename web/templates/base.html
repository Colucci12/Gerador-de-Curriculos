<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Resume Tailor{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    :root { --pico-font-size: 16px; }
    main.container { max-width: 1200px; padding-top: 1.5rem; padding-bottom: 2rem; }
    textarea { min-height: 12rem; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9rem; }
    .flash { margin-bottom: 1rem; }
    .flash.error { color: var(--pico-del-color); }
    .flash.success { color: var(--pico-ins-color); }
    .htmx-indicator { display: none; }
    .htmx-indicator.htmx-request { display: inline; }
    .htmx-request .btn-label { display: none; }
    nav { margin-bottom: 1rem; }
    .generator-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.25rem;
    }
    @media (min-width: 960px) {
      .generator-layout { grid-template-columns: 1fr 1fr; align-items: start; }
      #generated-md { min-height: 18rem; }
      #pdf-preview { min-height: 70vh; }
    }
    .generator-preview iframe {
      width: 100%;
      min-height: 28rem;
      border: 1px solid var(--pico-muted-border-color);
      border-radius: var(--pico-border-radius);
      background: #f6f6f6;
    }
    .preset-controls { margin: 1rem 0; }
    .preset-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
    }
    .preset-buttons label {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      margin: 0;
      font-weight: normal;
    }
    .pdf-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 0.75rem;
    }
    .page-status { font-size: 0.9rem; color: var(--pico-muted-color); }
    .page-status.warn { color: #8a5a00; font-weight: 600; }
    .muted-hint { color: var(--pico-muted-color); font-size: 0.9rem; }
    .tabs-row {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      margin-bottom: 1rem;
    }
    .main-tabs { margin: 0; }
    .settings-kiosk {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.5rem;
      height: 2.5rem;
      flex-shrink: 0;
      padding: 0;
      margin: 0;
      border: 1px solid var(--pico-muted-border-color);
      border-radius: var(--pico-border-radius);
      background: var(--pico-card-background-color, transparent);
      color: var(--pico-muted-color);
      text-decoration: none;
      box-sizing: border-box;
    }
    .settings-kiosk:hover {
      color: var(--pico-color);
      border-color: var(--pico-muted-color);
    }
    .settings-kiosk.is-active {
      color: var(--pico-color);
      border-color: var(--pico-muted-color);
      background-color: color-mix(in srgb, var(--pico-muted-border-color) 55%, transparent);
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .provider-cards {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .provider-card {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem 1rem;
      width: 100%;
      margin: 0;
      border: 1px solid var(--pico-muted-border-color);
      border-radius: var(--pico-border-radius);
      padding: 0.85rem 1.1rem;
    }
    .provider-meta {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
      min-width: 8rem;
      flex-shrink: 0;
    }
    .provider-name { font-size: 1rem; }
    .provider-status { margin: 0; font-size: 0.9rem; }
    .provider-actions {
      display: flex;
      flex: 1 1 16rem;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 0.75rem;
      min-width: 0;
    }
    .provider-save-form {
      display: flex;
      flex: 1 1 12rem;
      align-items: center;
      gap: 0.5rem 0.75rem;
      margin: 0;
      min-width: 0;
    }
    .provider-input-label {
      flex: 1 1 8rem;
      margin: 0;
      min-width: 0;
    }
    .provider-input-label input {
      margin: 0;
      width: 100%;
    }
    .provider-save-form button,
    .provider-delete-form button {
      margin: 0;
      white-space: nowrap;
      width: auto;
    }
    .provider-delete-form { margin: 0; }
    @media (max-width: 640px) {
      .provider-card {
        flex-direction: column;
        align-items: stretch;
      }
      .provider-actions,
      .provider-save-form {
        flex-direction: column;
        align-items: stretch;
      }
      .provider-save-form button,
      .provider-delete-form button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <p class="flash {{ category }}" role="status">{{ message }}</p>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
